# Publishes the website in site/ to GitHub Pages.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", "docs/brand/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # site/ links to the screenshots and logo under docs/; copy the real files.
      - run: cp -rL site _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # A separate job: the upload only becomes visible to the deploy once its job ends.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
