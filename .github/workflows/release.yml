name: Release

# Pushing a tag like v0.2.0 builds the desktop app and attaches it to a draft
# release, and publishes the server's Docker image. Publish the draft to make the
# release visible; installed apps and servers then offer the update with its notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The server reads its version from the VERSION file, so it has to match the tag.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VERSION matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(tr -d '[:space:]' < VERSION)"
          if [ "$want" != "$have" ]; then
            echo "::error::VERSION says $have but the tag is $want. Update VERSION, commit, and tag again."
            exit 1
          fi

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: --linux AppImage deb
          - os: windows-latest
            targets: --win nsis portable
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/scanner-go/go.mod
          cache-dependency-path: server/scanner-go/go.sum
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: desktop
      - name: Set the app version from the tag
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run bundle
        working-directory: desktop
      - run: npx electron-builder ${{ matrix.targets }} --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  release:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --generate-notes

  # The server as a ready-made image: ghcr.io/localhostmusic/localhostmusic
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image tags
        id: tags
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/localhostmusic/localhostmusic:${{ steps.tags.outputs.version }}
            ghcr.io/localhostmusic/localhostmusic:latest
          labels: |
            org.opencontainers.image.source=https://github.com/localhostmusic/localhostmusic
            org.opencontainers.image.description=Localhost Music server and web player
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
