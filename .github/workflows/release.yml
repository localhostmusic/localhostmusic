name: Release

# Pushing a tag like v0.2.0 builds the desktop app and attaches it to a draft
# release. Publish the draft to make it visible; installed apps then offer the update
# and show the release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: --linux AppImage deb
          - os: windows-latest
            targets: --win nsis portable
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/scanner-go/go.mod
          cache-dependency-path: server/scanner-go/go.sum
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: desktop
      - name: Set the app version from the tag
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run bundle
        working-directory: desktop
      - run: npx electron-builder ${{ matrix.targets }} --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  release:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --generate-notes
